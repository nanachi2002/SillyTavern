apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// SillyTavern version from package.json; bump mobileRevision for Android-only releases.
def stVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version as String
def mobileRevision = 2
def (stMajor, stMinor, stPatch) = stVersion.tokenize('.-').take(3).collect { it.toInteger() }

// ABIs for which nodejs-mobile's libnode.so has been fetched (node mobile/fetch-libnode.mjs)
def libnodeDir = file('libnode/bin')
def availableAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64'].findAll { new File(libnodeDir, "${it}/libnode.so").exists() }
def buildAbis = availableAbis.isEmpty() ? ['arm64-v8a'] : availableAbis

// Release signing: ST_KEYSTORE* environment variables or gradle properties, or the legacy
// release.keystore next to the repository. Without one, release builds use the debug key.
def signingValue = { String name -> System.getenv(name) ?: (project.findProperty(name) as String) }
def keystorePath = signingValue('ST_KEYSTORE') ?: rootProject.file('../release.keystore').path
def hasReleaseKeystore = new File(keystorePath).exists()

android {
    namespace = 'ai.sillytavern.app'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'ai.sillytavern.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode stMajor * 1000000 + stMinor * 10000 + stPatch * 100 + mobileRevision
        versionName "${stVersion}-android.${mobileRevision}"
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17 -Wall'
                abiFilters(*buildAbis)
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include(*buildAbis)
            universalApk buildAbis.size() > 1
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword signingValue('ST_KEYSTORE_PASSWORD') ?: 'sillytavern'
                keyAlias signingValue('ST_KEY_ALIAS') ?: 'sillytavern'
                keyPassword signingValue('ST_KEY_PASSWORD') ?: 'sillytavern'
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The server bundle is already compressed
        noCompress 'zip'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    lint {
        // CI runs lint for API-level problems; the full default rule set isn't enforced
        checkOnly 'NewApi', 'InlinedApi', 'MissingPermission', 'WrongConstant', 'JavascriptInterface'
        abortOnError true
    }
}

tasks.named('preBuild').configure {
    doFirst {
        if (availableAbis.isEmpty()) {
            throw new GradleException('libnode.so not found in android/app/libnode/bin/<abi>/. Run: node mobile/fetch-libnode.mjs')
        }
        if (!file('src/main/assets/sillytavern.zip').exists() || !file('src/main/assets/sillytavern-build.json').exists()) {
            throw new GradleException('The SillyTavern server bundle is missing. Run: node mobile/build-assets.mjs')
        }
        if (!hasReleaseKeystore) {
            logger.warn('No release keystore found (ST_KEYSTORE); release builds will be signed with the debug key.')
        }
    }
}
