# Android app overrides.
# When the app starts for the first time it creates its config.yaml from default/config.yaml
# and applies the values below. The generated file can be edited afterwards like on desktop;
# it is never overwritten by app updates.

# There is no browser to launch: the app shows the UI in its own WebView.
browserLaunch:
  enabled: false
# Only the app itself connects to the server.
listen: false
protocol:
  ipv4: true
  ipv6: false
# No git binary on Android: use the integrated JavaScript implementation for extensions.
git:
  backend: builtin
# Phones have less memory than desktops.
performance:
  lazyLoadCharacters: true
  memoryCacheCapacity: '50mb'
# Fewer, smaller backups to save storage.
backups:
  common:
    numberOfBackups: 10
  chat:
    maxTotalBackups: 200
