name: Android Release

# Push a tag like v1.18.0-android.3 to publish signed APKs as a GitHub release.
# The tag must match the versionName in android/app/build.gradle (SillyTavern version + mobileRevision).
#
# Two modes:
#  - Build: when the signing secrets below are set, the APKs are built, tested and signed here.
#      ST_KEYSTORE_BASE64 (the release keystore, base64-encoded), ST_KEYSTORE_PASSWORD,
#      ST_KEY_ALIAS, ST_KEY_PASSWORD
#  - Prebuilt: without them, the APKs that were built and signed locally are taken from the
#    `apk` branch. They must match the tag's version and carry the release certificate.
on:
  push:
    tags: ['v*-android.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.18.0-android.3'
        required: true

permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate; every published APK must carry it
  RELEASE_CERT_SHA256: 732a9a983cefa43aef77390cfa0a08e9b7fe0e77fed89dd578f4e5935fda1dd1

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      APK_DIR: ${{ github.workspace }}/release-apks
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Choose mode
        id: mode
        env:
          ST_KEYSTORE_BASE64: ${{ secrets.ST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ST_KEYSTORE_BASE64" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found: building the APKs."
          else
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: publishing the prebuilt APKs from the apk branch."
          fi

      # ---- Build mode ----
      - name: Set up Node.js 20 (build machine)
        if: steps.mode.outputs.mode == 'build'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle the server
        if: steps.mode.outputs.mode == 'build'
        run: node mobile/build-assets.mjs

      - name: Smoke test the bundle on Node.js 18.20.4 (the Android runtime version)
        if: steps.mode.outputs.mode == 'build'
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          node mobile/test/smoke-test.mjs "$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node"

      - name: Fetch libnode.so (nodejs-mobile)
        if: steps.mode.outputs.mode == 'build'
        run: node mobile/fetch-libnode.mjs

      - name: Set up JDK 17
        if: steps.mode.outputs.mode == 'build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.mode.outputs.mode == 'build'
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APKs
        if: steps.mode.outputs.mode == 'build'
        working-directory: android
        env:
          ST_KEYSTORE_BASE64: ${{ secrets.ST_KEYSTORE_BASE64 }}
          ST_KEYSTORE_PASSWORD: ${{ secrets.ST_KEYSTORE_PASSWORD }}
          ST_KEY_ALIAS: ${{ secrets.ST_KEY_ALIAS }}
          ST_KEY_PASSWORD: ${{ secrets.ST_KEY_PASSWORD }}
        run: |
          export ST_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ST_KEYSTORE_BASE64" | base64 -d > "$ST_KEYSTORE"
          ./gradlew --no-daemon assembleRelease lintRelease
          rm -f "$ST_KEYSTORE"
          mkdir -p "$APK_DIR"
          cp app/build/outputs/apk/release/*.apk "$APK_DIR/"

      # ---- Prebuilt mode ----
      - name: Take the prebuilt APKs from the apk branch
        if: steps.mode.outputs.mode == 'prebuilt'
        run: |
          git fetch --depth=1 origin apk
          mkdir -p "$APK_DIR"
          git --work-tree="$APK_DIR" checkout FETCH_HEAD -- .
          find "$APK_DIR" -maxdepth 1 -type f ! -name '*.apk' -delete
          ls -la "$APK_DIR"

      # ---- Both modes ----
      - name: Check version and signature
        run: |
          VERSION="${TAG#v}"
          shopt -s nullglob
          apks=("$APK_DIR"/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "::error::No APKs found"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            if [[ "$name" != SillyTavern-"$VERSION"-*.apk ]]; then
              echo "::error::$name does not match the tag's version $VERSION"
              exit 1
            fi
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$name: $CERTS"
            if [[ "$CERTS" != *"certificate SHA-256 digest: $RELEASE_CERT_SHA256"* ]]; then
              echo "::error::$name is not signed with the release certificate"
              exit 1
            fi
          done
          (cd "$APK_DIR" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=mobile/RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "Release notes for $TAG" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_DIR"/*.apk "$APK_DIR/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" "$APK_DIR"/*.apk "$APK_DIR/SHA256SUMS.txt" \
              --title "SillyTavern for Android ${TAG#v}" --notes-file "$NOTES" --latest
          fi
