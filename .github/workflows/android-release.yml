name: Android Release

# Push a tag like v1.18.0-android.3 to build signed APKs and publish them as a GitHub release.
# The tag must match the versionName in android/app/build.gradle (SillyTavern version + mobileRevision).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ST_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ST_KEYSTORE_PASSWORD  keystore password
#   ST_KEY_ALIAS          key alias
#   ST_KEY_PASSWORD       key password
on:
  push:
    tags: ['v*-android.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v1.18.0-android.3'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check signing secrets
        env:
          ST_KEYSTORE_BASE64: ${{ secrets.ST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ST_KEYSTORE_BASE64" ]; then
            echo "::error::ST_KEYSTORE_BASE64 is not set. Release APKs must be signed with the release key, otherwise users can't update."
            exit 1
          fi

      - name: Set up Node.js 20 (build machine)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle the server
        run: node mobile/build-assets.mjs

      - name: Smoke test the bundle on Node.js 18.20.4 (the Android runtime version)
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          node mobile/test/smoke-test.mjs "$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node"

      - name: Fetch libnode.so (nodejs-mobile)
        run: node mobile/fetch-libnode.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APKs
        working-directory: android
        env:
          ST_KEYSTORE_BASE64: ${{ secrets.ST_KEYSTORE_BASE64 }}
          ST_KEYSTORE_PASSWORD: ${{ secrets.ST_KEYSTORE_PASSWORD }}
          ST_KEY_ALIAS: ${{ secrets.ST_KEY_ALIAS }}
          ST_KEY_PASSWORD: ${{ secrets.ST_KEY_PASSWORD }}
        run: |
          export ST_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ST_KEYSTORE_BASE64" | base64 -d > "$ST_KEYSTORE"
          ./gradlew --no-daemon assembleRelease lintRelease
          rm -f "$ST_KEYSTORE"

      - name: Check version and signature
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          VERSION="${TAG#v}"
          ls "$APK_DIR"/SillyTavern-"$VERSION"-*.apk > /dev/null || {
            echo "::error::No APKs named for $VERSION. Does the tag match versionName (package.json version + mobileRevision)?"
            ls "$APK_DIR"
            exit 1
          }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in "$APK_DIR"/*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERTS"
            if [[ "$CERTS" == *"CN=Android Debug"* ]]; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done
          (cd "$APK_DIR" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=mobile/RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "Release notes for $TAG" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          APK_DIR=android/app/build/outputs/apk/release
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK_DIR"/*.apk "$APK_DIR/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" "$APK_DIR"/*.apk "$APK_DIR/SHA256SUMS.txt" \
              --title "SillyTavern for Android ${TAG#v}" --notes-file "$NOTES" --latest
          fi
