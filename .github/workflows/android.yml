name: Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - 'default/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20 (build machine)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle the server
        run: node mobile/build-assets.mjs

      - name: Smoke test the bundle on Node.js 18.20.4 (the Android runtime version)
        run: |
          curl -fsSL https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz | tar xJ -C "$RUNNER_TEMP"
          node mobile/test/smoke-test.mjs "$RUNNER_TEMP/node-v18.20.4-linux-x64/bin/node"

      - name: Fetch libnode.so (nodejs-mobile)
        run: node mobile/fetch-libnode.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs and run lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sillytavern-android-apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          compression-level: 0
